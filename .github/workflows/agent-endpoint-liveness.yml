name: Agent endpoint liveness 15d

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: agent-endpoint-liveness
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: workers/agent_endpoint_liveness
        run: uv sync

      - name: Run agent endpoint liveness census
        working-directory: workers/agent_endpoint_liveness
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MAX_RUNTIME_SECONDS: 19800
          CONCURRENCY: 20
          PER_HOST_CONCURRENCY: 2
          CLAIM_BATCH_SIZE: 40
          CLAIM_STALE_SECONDS: 7200
          WORKER_ID: liveness-a
        run: uv run python job.py
