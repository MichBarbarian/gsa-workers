name: Wallet funding transfers

on:
  schedule:
    # Drain only in UTC window 06:00→24:00 (was every 6h incl. 00:00). Closed 00:00–06:00.
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      provider_group:
        description: "etherscan | blockscout | bsc | xlayer (empty = all matrix cells)"
        required: false
        default: ""
      ignore_schedule_window:
        description: "Set true to run outside UTC 06:00→24:00 window"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [etherscan, blockscout, bsc, xlayer]
    concurrency:
      group: wallet-funding-transfers-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maybe skip matrix cell or closed UTC window
        id: gate
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.provider_group }}
          CELL: ${{ matrix.group }}
          IGNORE_WINDOW: ${{ github.event.inputs.ignore_schedule_window }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "$CELL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(date -u +%H)
          hour=$((10#$hour))
          if [ "$IGNORE_WINDOW" != "true" ] && [ "$hour" -lt 6 ]; then
            echo "Outside UTC window 06:00→24:00 (hour=${hour}); skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/wallet_funding_transfers
        run: uv sync

      - name: Run wallet funding transfers
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/wallet_funding_transfers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ETHERSCAN_FUNDING_KEY: ${{ secrets.ETHERSCAN_FUNDING_KEY }}
          BLOCKSCOUT_FUNDING_KEY: ${{ secrets.BLOCKSCOUT_FUNDING_KEY }}
          ANKR_FUNDING_KEY: ${{ secrets.ANKR_FUNDING_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          PROVIDER_GROUP: ${{ matrix.group }}
          MAX_RUNTIME_SECONDS: 19800
          CONCURRENCY: 1
          CLAIM_BATCH_SIZE: 20
          CLAIM_STALE_SECONDS: 7200
          FUNDING_MAX_TRANSFERS: 500
          WORKER_ID: ${{ matrix.group }}
          IGNORE_SCHEDULE_WINDOW: ${{ github.event.inputs.ignore_schedule_window || 'false' }}
        run: uv run python job.py
