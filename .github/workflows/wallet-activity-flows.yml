name: Wallet activity flows 15d

on:
  schedule:
    # Cuts at 00:00 UTC on days 1 and 15 (inside 18→12 window).
    - cron: "0 0 1,15 * *"
    # Drain only in UTC window 18:00→12:00 (~every 4h). Closed 12:00–18:00.
    - cron: "0 18,22,2,6,10 * * *"
  workflow_dispatch:
    inputs:
      provider_group:
        description: "etherscan | alchemy_k1 | bsc | xlayer (empty = all matrix cells)"
        required: false
        default: ""
      ignore_schedule_window:
        description: "Set true to run outside UTC 18:00→12:00 window"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [etherscan, alchemy_k1, bsc, xlayer]
    concurrency:
      group: wallet-activity-flows-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maybe skip matrix cell or closed UTC window
        id: gate
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.provider_group }}
          CELL: ${{ matrix.group }}
          IGNORE_WINDOW: ${{ github.event.inputs.ignore_schedule_window }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "$CELL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(date -u +%H)
          hour=$((10#$hour))
          if [ "$IGNORE_WINDOW" != "true" ] && [ "$hour" -ge 12 ] && [ "$hour" -lt 18 ]; then
            echo "Outside UTC window 18:00→12:00 (hour=${hour}); skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/wallet_activity_flows
        run: uv sync

      - name: Run wallet activity flows
        if: steps.gate.outputs.skip != 'true'
        working-directory: workers/wallet_activity_flows
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ALCHEMY_ACTIVITY_KEY_1: ${{ secrets.ALCHEMY_ACTIVITY_KEY_1 }}
          ALCHEMY_ACTIVITY_KEY_2: ${{ secrets.ALCHEMY_ACTIVITY_KEY_2 }}
          ANKR_API_KEY: ${{ secrets.ANKR_API_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          PROVIDER_GROUP: ${{ matrix.group }}
          MAX_RUNTIME_SECONDS: 19800
          CONCURRENCY: 1
          CLAIM_BATCH_SIZE: 20
          CLAIM_STALE_SECONDS: 7200
          WORKER_ID: ${{ matrix.group }}
          IGNORE_SCHEDULE_WINDOW: ${{ github.event.inputs.ignore_schedule_window || 'false' }}
        run: uv run python job.py
